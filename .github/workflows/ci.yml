name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Test and build
        working-directory: android
        run: gradle --no-daemon test assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WatchBridge-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: WatchBridge-android.apk

  watch:
    # macos-13 is the free Intel runner; macos-14 (arm64) needs a paid plan on this account.
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode on the runner
        run: |
          ls /Applications | grep -i xcode
          sudo xcode-select -s "$(ls -d /Applications/Xcode_15*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Test shared logic
        working-directory: watch/BridgeCore
        run: swift test
      - name: Generate project
        working-directory: watch
        run: brew install xcodegen && xcodegen
      - name: Build (unsigned)
        working-directory: watch
        run: |
          xcodebuild -project WatchBridge.xcodeproj -scheme WatchBridge -configuration Release \
            -destination generic/platform=iOS -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0
      - name: Package IPA
        working-directory: watch
        run: |
          APP=build/Build/Products/Release-iphoneos/WatchBridge.app
          EXT=$(find "$APP" -name '*.appex' -path '*Watch*' | head -1)
          lipo -info "$EXT/WatchBridgeWatchExtension"
          codesign -f -s - --entitlements WatchExtension/WatchExtension.entitlements "$EXT"
          codesign -f -s - "$APP/Watch/WatchBridgeWatch.app"
          codesign -f -s - "$APP"
          mkdir Payload && cp -R "$APP" Payload/
          zip -qry ../WatchBridge-watch.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: watch
          path: WatchBridge-watch.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, watch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            WatchBridge-android.apk
            WatchBridge-watch.ipa
